# Mises à jour de sécurité automatiques (Capacitor, plugins Android, actions GitHub)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
