name: Tests B2A Smart Farming

# Lancé avant chaque publication (appelé par build.yml) et sur toute autre branche.
# Si un test échoue, rien n'est publié : le site et l'APK restent sur la version précédente.
on:
  push:
    branches-ignore: [main, marche, gh-pages]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Code, écrans et traductions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installer les outils de test
        run: |
          npm install --prefix tests --no-audit --no-fund
          npx --prefix tests playwright install --with-deps chromium
      - name: Contrôles (syntaxe, versions, fichiers, secrets, règles)
        run: node tests/run.mjs "Contrôles" node tests/static.mjs
      - name: Écrans (code lisible)
        run: node tests/run.mjs "Écrans" node tests/smoke.mjs
      - name: Écrans (code compressé, tel qu'il est publié)
        run: |
          cp -r www "$RUNNER_TEMP/publie"
          cd "$RUNNER_TEMP/publie"
          for f in *.js; do "$GITHUB_WORKSPACE/tests/node_modules/.bin/terser" "$f" --compress passes=2 --mangle --comments false -o "$f.min" && mv "$f.min" "$f"; done
          cd "$GITHUB_WORKSPACE"
          node tests/run.mjs "Écrans (compressé)" node tests/smoke.mjs "$RUNNER_TEMP/publie"
      - name: Traductions (italien, anglais, espagnol)
        run: node tests/run.mjs "Traductions" node tests/i18n.mjs

  regles:
    name: Règles de sécurité Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les outils de test
        run: npm install --prefix tests --no-audit --no-fund
      - name: Tester firestore.rules avec l'émulateur
        working-directory: tests
        run: node run.mjs "Règles Firebase" npx firebase emulators:exec --only firestore --project demo-b2a \"node --test --test-reporter=spec rules.test.mjs\"
