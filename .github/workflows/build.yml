name: Construire et publier B2A Smart Farming

on:
  push:
    # main : application publiée (site + APK + AAB) · marche : version d'essai du Marché, en ligne seulement sous /essai/
    branches: [main, marche]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  # Tests automatiques (écrans, traductions, règles Firebase) : la publication ne part que s'ils réussissent
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  publier:
    name: Site web + APK + AAB Google Play
    needs: tests
    runs-on: ubuntu-latest
    env:
      # Numéro de version Android : augmente tout seul à chaque construction (obligatoire pour Google Play)
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main          # le site publié vient toujours de main, même quand la branche marche déclenche la publication
          fetch-depth: 0

      # Le code publié (site + APK) est compressé et brouillé : plus difficile à lire et à recopier.
      # Les fichiers lisibles restent seulement dans ce dépôt.
      - name: Compresser et brouiller le code publié
        run: |
          cd www
          for f in *.js; do
            npx --yes terser@5.36.0 "$f" --compress passes=2 --mangle --comments false -o "$f.min"
            mv "$f.min" "$f"
          done
          ls -l *.js

      - name: Clé de signature présente ?
        id: cle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret ANDROID_KEYSTORE_B64 absent : le site est publié, mais pas d'APK ni d'AAB. Voir LISEZ-MOI.md, étape 1, point 4."
          fi

      # Capacitor 8 : Node 22 et Java 21, cible Android 16 (API 36) exigée par Google Play depuis le 31/08/2026
      - if: steps.cle.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.cle.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le projet Android
        if: steps.cle.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          # Mots de passe : secrets facultatifs ; sinon valeurs de la clé actuelle
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm install
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor "#1b2e4c" --splashBackgroundColor "#000000" || echo "Icône par défaut conservée"
          npx cap sync android
          # Icône de l'application = logo B2A (fichiers déjà prêts dans android-res/, écrasent l'icône par défaut de Capacitor)
          rm -f android/app/src/main/res/drawable*/ic_launcher_background.xml android/app/src/main/res/drawable*/ic_launcher_foreground.xml
          cp -r android-res/. android/app/src/main/res/
          ls android/app/src/main/res/mipmap-xxxhdpi/
          # Lecture à voix haute (Android 11+) : déclarer l'accès au moteur de voix du téléphone
          M=android/app/src/main/AndroidManifest.xml
          grep -q TTS_SERVICE "$M" || sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' "$M"
          grep -n TTS_SERVICE "$M" || true
          # Google Play : pas d'alarmes exactes (les rappels utilisent des alarmes normales, allowWhileIdle)
          grep -q 'xmlns:tools' "$M" || sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$M"
          grep -q 'SCHEDULE_EXACT_ALARM" tools:node' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove" />\n</manifest>#' "$M"
          grep -n "EXACT_ALARM\|xmlns:tools" "$M" || true
          VERSION_NAME=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName|targetSdk|compileSdk" android/app/build.gradle android/variables.gradle || true
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "KS_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "KS_PASS=${KS_PASS:-android}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
          echo "KEY_PASS=${KEY_PASS:-android}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Vérifier la clé (Google Play refuse les certificats « Android Debug »)
        if: steps.cle.outputs.ok == 'true'
        run: |
          keytool -list -v -keystore "$KS_FILE" -storepass "$KS_PASS" -alias "$KEY_ALIAS" | grep -E "^(Owner|Propriétaire|Valid|SHA256)" || true
          if keytool -list -v -keystore "$KS_FILE" -storepass "$KS_PASS" -alias "$KEY_ALIAS" | grep -q "CN=Android Debug"; then
            echo "::error::La clé actuelle est une clé de débogage : Google Play la refusera. Voir LISEZ-MOI-GOOGLE-PLAY.md, section « Clé »."
          fi

      - name: Compiler l'APK et l'AAB signés (mode release)
        if: steps.cle.outputs.ok == 'true'
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS_FILE" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../www/b2a-smart-farming.apk
          cp app/build/outputs/bundle/release/app-release.aab ../b2a-smart-farming-${VERSION_NAME}-${VERSION_CODE}.aab
          rm -f "$KS_FILE"

      - name: Mettre l'AAB (Google Play) dans une « Release » GitHub
        if: steps.cle.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION_NAME}-${VERSION_CODE}"
          gh release create "$TAG" "b2a-smart-farming-${VERSION_NAME}-${VERSION_CODE}.aab" www/b2a-smart-farming.apk \
            --title "B2A Smart Farming ${VERSION_NAME} (version ${VERSION_CODE})" \
            --notes "Fichier .aab : à envoyer dans Google Play Console. Fichier .apk : installation directe sur Android." \
            --target "$GITHUB_SHA" --latest

      - name: Garder l'APK déjà publié (si pas de nouvelle compilation)
        if: steps.cle.outputs.ok != 'true'
        run: |
          git fetch origin gh-pages 2>/dev/null && git show origin/gh-pages:b2a-smart-farming.apk > www/b2a-smart-farming.apk 2>/dev/null || rm -f www/b2a-smart-farming.apk

      # Version d'essai du Marché (branche marche) : https://azizyou2005.github.io/b2a-smart-farming/essai/
      # Non indexée, absente de l'APK et de Google Play ; même Firebase que l'application publiée.
      - name: Ajouter la version d'essai (branche marche)
        run: |
          if git fetch -q origin marche 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/essai" www/essai
            git archive origin/marche www | tar -x -C "$RUNNER_TEMP/essai"
            cp -r "$RUNNER_TEMP/essai/www/." www/essai/
            rm -f www/essai/b2a-smart-farming.apk
            sed -i 's/"b2a-v/"b2a-essai-v/; s/keys.filter(k => k !== CACHE)/keys.filter(k => k !== CACHE \&\& k.startsWith("b2a-essai"))/' www/essai/sw.js
            python3 - <<'PY'
          p="www/essai/index.html";s=open(p,encoding="utf-8").read()
          s=s.replace("<head>",'<head><meta name="robots" content="noindex">',1)
          badge='<div style="position:fixed;left:8px;bottom:96px;z-index:999;background:#c0392b;color:#fff;font:700 11px/1 sans-serif;padding:6px 9px;border-radius:9px;pointer-events:none">VERSION D\'ESSAI</div>'
          s=s.replace("</body>",badge+"</body>",1);open(p,"w",encoding="utf-8").write(s)
          PY
            echo "Version d'essai ajoutée : $(git rev-parse --short origin/marche)"
          else echo "Pas de branche marche : pas de version d'essai"; fi

      - name: Publier sur GitHub Pages (branche gh-pages)
        run: |
          cp -r store www/store
          cp -r carta www/carta
          cd www
          touch .nojekyll
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publication ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
