<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B2A Smart Farming</title>
<meta name="theme-color" content="#0D1117">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0D1117;color:#fff;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box;text-align:center}
main{max-width:420px;display:grid;gap:16px;justify-items:center}
h1{margin:0;font-size:22px}
p{margin:0;color:#B8BFC9;line-height:1.5}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:#73AA4F;color:#0D1117;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>Page introuvable</h1>
  <p>Ce fichier n'est pas (encore) disponible. Vos données sont intactes.</p>
  <a href="./" id="back">Retour à l'application</a>
</main>
<script>
/* Revenir à la racine du site, quel que soit le chemin (GitHub Pages sert cette page pour tout fichier manquant) */
(function(){var parts=location.pathname.split("/");var root=location.hostname.endsWith("github.io")&&parts[1]?"/"+parts[1]+"/":"/";document.getElementById("back").href=root})();
</script>
</body>
</html>
