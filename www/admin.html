<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.workers.dev; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>B2A · Codes d'accès IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: B2A brand band (original logo on black) on top, then tabs — Tableau, Saisie, Soins & alertes, Diagnostic */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --ink:#141d2e; --muted:#5a6477; --line:#d8dde7;
  --leaf:#1b2e4c; --leaf-soft:#e2e8f2; --millet:#c98f2e; --millet-soft:#f8ecd4;
  --brand-green:#72ac48; --brand-gold:#deab50; --band:#ffffff; --band-ink:#7a8396;
  --ok:#4c8a2a; --warn:#b77a06; --bad:#b3372a; --ok-bg:#e5f0dc; --warn-bg:#f8ecd0; --bad-bg:#f7dfda;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070b14; --surface:#10182b; --ink:#e7ebf3; --muted:#909bb2; --line:#243049;
  --leaf:#93acdf; --leaf-soft:#1b2842; --millet:#e6b45c; --millet-soft:#3a2f17;
  --ok:#8cc865; --warn:#e9b44c; --bad:#ef8a7c; --ok-bg:#1d3320; --warn-bg:#3a2f15; --bad-bg:#3d201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070b14; --surface:#10182b; --ink:#e7ebf3; --muted:#909bb2; --line:#243049;
  --leaf:#93acdf; --leaf-soft:#1b2842; --millet:#e6b45c; --millet-soft:#3a2f17;
  --ok:#8cc865; --warn:#e9b44c; --bad:#ef8a7c; --ok-bg:#1d3320; --warn-bg:#3a2f15; --bad-bg:#3d201c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1,h2,h3,.kpi b,.lot b{font-stretch:108%}
.band{background:var(--band);padding-block:18px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:14px}
.band .ic{width:64px;height:64px;flex:none;border-radius:14px}
.band .lock{display:grid;gap:6px;min-width:0}
.band .wm{height:38px;width:auto;max-width:100%;justify-self:start}
.band .sl{width:min(250px,100%);height:auto}
.band .app{margin-left:auto;text-align:right;color:#c9d2e3;font:600 12px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase}
.band .app b{display:block;color:#ffffff;font:800 17px/1.1 var(--display);font-stretch:112%;letter-spacing:.02em;text-transform:none}
.band .app b span{color:var(--brand-green)}
@media (max-width:520px){.band .app{display:none}.band .ic{width:56px;height:56px}.band .wm{height:32px}}
header h1{font:800 clamp(24px,6vw,32px)/1.1 var(--display);font-stretch:112%;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--brand-green)}
header p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.foot{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--muted);font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;padding-top:8px;border-top:1px solid var(--line)}
.foot img{width:28px;height:28px;border-radius:7px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:700 14px/1.2 var(--body);padding:10px 4px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--leaf);color:var(--surface);box-shadow:inset 0 -3px 0 var(--brand-green)}
.view{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.label{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2.sec,h3.sec{font:700 20px/1.2 var(--display);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:10px}
.seg button{border:0;background:transparent;color:var(--muted);font:700 15px var(--body);padding:10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--leaf);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.drop{position:relative;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick .btn{display:inline-block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);cursor:pointer;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field label{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;font:16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{min-height:72px;resize:vertical}
:focus-visible{outline:3px solid var(--millet);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 18px;font:700 16px var(--body);cursor:pointer;background:var(--leaf);color:var(--surface);text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.msg{font-size:14px;color:var(--muted)}
.msg.err{color:var(--bad)} .msg.good{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:12px;display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--ink);font:700 18px var(--display)}
/* lots list */
.lots{display:grid;gap:8px}
.lot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.lot[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.lot b{font:700 17px var(--display);min-width:0;overflow-wrap:anywhere}
.lot small{color:var(--muted);grid-column:1}
.lot .pill{grid-row:1/span 2;grid-column:2;align-self:center}
.pill{justify-self:start;font:700 13px var(--body);padding:4px 10px;border-radius:999px;white-space:nowrap}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-warn{background:var(--warn-bg);color:var(--warn)} .s-bad{background:var(--bad-bg);color:var(--bad)} .s-none{background:var(--bg);color:var(--muted)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font:500 24px/1.15 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:13px}
.kpi .up{color:var(--ok)} .kpi .down{color:var(--bad)}
.alerts{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:15px}
.alerts .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:currentColor}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:12px var(--mono)}
.chart .line{fill:none;stroke:var(--leaf);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--leaf);opacity:.12}
.chart .end{fill:var(--leaf);stroke:var(--surface);stroke-width:2}
.chart .endlbl{fill:var(--ink);font:600 13px var(--mono)}
.chart .mort{fill:var(--bad);opacity:.7}
.chart .ref{fill:none;stroke:var(--millet);stroke-width:2;stroke-dasharray:6 5}
.chart .pos{fill:var(--ok);opacity:.16} .chart .neg{fill:var(--bad);opacity:.14}
.chart .band{fill:var(--leaf);opacity:.1}
.chart .zero{stroke:var(--ink);stroke-width:1.2;opacity:.55}
.chart .phase{fill:var(--bg)} .chart .phaselbl{fill:var(--muted);font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase}
.chart .belbl{fill:var(--ok);font:700 13px var(--body)}
.chart .tip rect{fill:var(--surface);stroke:var(--line)} .chart .tip text{fill:var(--ink);font:600 12px var(--mono)}
.chart .cursor{stroke:var(--ink);stroke-width:1;opacity:.4}
.chart .hit{fill:transparent;cursor:crosshair;touch-action:pan-y}
.s-info{background:var(--leaf-soft);color:var(--leaf)}
.alerts li .lotname{font-weight:700}
.cal{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.cal li{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--bg);border-left:4px solid var(--line)}
.cal li.late{border-left-color:var(--bad)} .cal li.soon{border-left-color:var(--warn)} .cal li.done{opacity:.6;border-left-color:var(--ok)}
.cal .d{font:500 13px/1.25 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d b{display:block;font-size:15px;color:var(--ink)}
.cal .w{min-width:0} .cal .w b{display:block;overflow-wrap:anywhere} .cal .w small{color:var(--muted);font-size:13px}
.cal .t{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-right:6px}
.t-vaccin{background:var(--leaf-soft);color:var(--leaf)} .t-traitement{background:var(--millet-soft);color:var(--ink)} .t-conduite{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--leaf)}
.legend i.d{border-top:2px dashed var(--millet)} .legend i.b{height:10px;border:0;background:var(--leaf);opacity:.25;border-radius:2px}
.tablewrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.data td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.data th.n{text-align:right}
details.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.box summary{cursor:pointer;font-weight:700}
details.box[open] summary{margin-bottom:12px}
/* Report */
.report-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.report-head img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none}
.report-head .id{flex:1;min-width:0}
.tag{display:inline-block;font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--millet-soft);color:var(--ink)}
.report-head h2{font:800 26px/1.1 var(--display);margin:6px 0 2px}
.sci{font-style:italic;color:var(--muted)}
.conf{font:500 13px var(--mono);color:var(--muted);margin-top:4px}
.alts{font-size:14px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0}
.facts div{background:var(--surface);padding:10px 12px;min-width:0}
.facts dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.meter{border-radius:12px;padding:14px;display:grid;gap:8px;border:1px solid var(--line)}
.meter h3{margin:0;font:700 18px var(--display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter .score{font:500 22px var(--mono);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.meter p{margin:0;font-size:15px}
.meter ul{margin:0;padding-left:18px;font-size:15px}
.signs{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.signs li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--bg)}
.signs .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.priority{border-left:4px solid var(--millet);background:var(--millet-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.priority strong{display:block;font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.plan td:first-child{font-weight:700;color:var(--leaf);white-space:nowrap}
.plan td:last-child{font:500 13px var(--mono);color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.hist{display:grid;gap:8px}
.hist button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;color:var(--ink);font:inherit}
.hist img{width:48px;height:48px;object-fit:cover;border-radius:6px;flex:none}
.hist .t{min-width:0;flex:1}
.hist .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist small{color:var(--muted)}
.spinner{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--leaf);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

/* standalone */
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.band{padding-top:max(18px,calc(env(safe-area-inset-top,0px) + 10px))}
.band .tools{margin-left:auto;display:grid;gap:8px;justify-items:end}
.band .gear{background:transparent;border:1px solid #3a4560;color:#e6ebf5;border-radius:999px;padding:7px 12px;font:600 13px var(--body);cursor:pointer}
.syncpill{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#aab4c8;padding:3px 8px;border-radius:999px;border:1px solid #3a4560;white-space:nowrap}
.syncpill.on{color:#9fd77a;border-color:#3d6b2a}.syncpill.off{color:#e9b44c;border-color:#6b5320}
@media (max-width:420px){.band .sl{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font:600 14px var(--body);cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{background:var(--leaf);color:var(--surface);border-color:var(--leaf)}
.seg4{display:flex;flex-wrap:wrap;gap:6px}
.seg4 button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 14px var(--body);padding:9px 12px;border-radius:9px;cursor:pointer}
.seg4 button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.urgent{background:var(--bad-bg);color:var(--bad);border-left:5px solid var(--bad);padding:12px 14px;border-radius:0 10px 10px 0;display:grid;gap:4px}
.dis{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.dis ul{margin:0;padding-left:20px}
.farmcode{font:500 28px var(--mono);letter-spacing:.18em;padding:10px 14px;background:var(--bg);border-radius:10px;justify-self:start}
.members{margin:0;padding-left:18px}
#r-sync{display:grid;gap:12px}

.codes td .btn{margin:2px}
.codes td.c{font-family:var(--mono);font-weight:500;white-space:nowrap}
.off{opacity:.5}

/* Bandeau clair, comme l'application */
.band{border-bottom:1px solid #dfe3ea;box-shadow:0 2px 10px rgb(27 46 76/.06)}
.band .app{color:#5b6475}.band .app b{color:#1b2e4c}
.band .gear{border-color:#c5ccd8;color:#1b2e4c}.band .gear:hover{border-color:#1b2e4c;background:#f2f4f8}
.syncpill{border-color:#c5ccd8;color:#5b6475}
</style>

  <header><h1>Codes d'accès <span>IA</span></h1><p>Réservé à B2A : créez, suivez et désactivez les codes donnés aux clients.</p></header>
  <section class="card" id="login">
    <h2 class="sec">Connexion</h2>
    <div class="grid2">
      <div class="field"><label for="a-url">Adresse du serveur IA</label><input type="text" id="a-url" placeholder="https://b2a-ia.votre-nom.workers.dev"></div>

      <div class="field"><label for="n-quota">Analyses par mois</label><input type="number" id="n-quota" value="30" min="1"></div>
